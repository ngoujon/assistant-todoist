<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
    <title>Assistant Todoist</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 12.5l4.5 4.5L19.5 6.5" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="name">Assistant Todoist</div>
          <div class="sub" id="status-line"><span class="dot pending"></span>Démarrage…</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-new" class="icon-btn" title="Nouvelle conversation (⌘N)" aria-label="Nouvelle conversation">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Réglages" aria-label="Réglages">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5" />
          </svg>
        </button>
      </div>
    </header>

    <section id="settings" class="settings hidden">
      <label class="row">
        <span>Modèle</span>
        <select id="model">
          <option value="claude-opus-5">Opus 5 — le plus fin</option>
          <option value="claude-sonnet-5">Sonnet 5 — plus rapide</option>
          <option value="claude-haiku-4-5">Haiku 4.5 — express</option>
        </select>
      </label>
      <label class="row">
        <span>Créer et terminer sans confirmer</span>
        <input type="checkbox" id="auto-todoist" />
      </label>
      <p class="note-inline">Déplacer, modifier ou supprimer une tâche existante demande toujours ta validation.</p>
      <button id="btn-workspace" class="link-btn">Ouvrir l'espace de travail…</button>
    </section>

    <main id="scroll">
      <div id="thread"></div>
    </main>

    <footer>
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Que veut-on organiser ?" autofocus></textarea>
        <button id="btn-send" class="send" aria-label="Envoyer">
          <svg class="ic-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
          <svg class="ic-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2.5" />
          </svg>
        </button>
      </div>
      <div class="hint"><kbd>↩</kbd> envoyer · <kbd>⇧↩</kbd> nouvelle ligne · <kbd>esc</kbd> stop</div>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
